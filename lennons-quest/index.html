function genOW(sx,sy){
 const r=REG[sy][sx],R=REGIONS[r],t=new Uint8Array(176).fill(TI.FLOORX);
 const rand=mulberry(sx*977+sy*131+7);
 const set=(c,w,v)=>{if(c>=0&&c<16&&w>=0&&w<11)t[w*16+c]=v;};
 for(let c=0;c<16;c++){set(c,0,R.wall);set(c,10,R.wall);}for(let w=0;w<11;w++){set(0,w,R.wall);set(15,w,R.wall);}
 // openings
 const opn=(v)=>v;
 if(sy>0)for(let c=6;c<=9;c++)set(c,0,TI.FLOORX);
 if(sy<OW_H-1)for(let c=6;c<=9;c++)set(c,10,TI.FLOORX);
 if(sx>0)for(let w=4;w<=6;w++)set(0,w,TI.FLOORX);
 if(sx<OW_W-1)for(let w=4;w<=6;w++)set(15,w,TI.FLOORX);
 // wider natural openings in some screens
 const quads=[[1,1],[10,1],[1,7],[10,7]];
 const pats=r==='G'?['grid','grid','scatter','grid']:r==='L'?['pond','pond','pond','empty']:r==='M'?['clump','scatter','block','clump']:['clump','scatter','block','empty','dots'];
 quads.forEach(([qc,qr],qi)=>{
  const p=pats[Math.floor(rand()*pats.length)];
  for(let dc=0;dc<5;dc++)for(let dr=0;dr<3;dr++){const c=qc+dc,w=qr+dr;let v=-1;
   if(p==='scatter'&&rand()<0.3)v=R.obs;
   else if(p==='block'&&dc>=1&&dc<=3&&dr>=0&&dr<=1)v=R.obs;
   else if(p==='clump'&&((dc<2&&dr<2)||(dc>=3&&dr>=1)))v=R.obs;
   else if(p==='dots'&&dc%2===1&&dr%2===0)v=R.obs;
   else if(p==='grid'&&dc%2===0&&dr%2===1)v=R.obs;
   else if(p==='pond'&&dc>=0&&dr>=0&&!(dc===0&&dr===(qr===1?0:2))&&!(dc===4&&dr===(qr===1?0:2)))v=TI.WATER;
   if(v>=0)set(c,w,v);
   else if(r==='O'&&rand()<0.08)set(c,w,TI.FLOWER);
  }
 });
 if(r==='O'||r==='F'){for(let i=0;i<6;i++){const c=1+Math.floor(rand()*14),w=1+Math.floor(rand()*9);if(t[w*16+c]===TI.FLOORX&&(w<4||w>6)&&(c<6||c>9)&&r==='O')set(c,w,TI.FLOWER);}}
 // features
 const f=FEAT[sx+','+sy];
 if(f){
  const fac=(r==='M'||r==='D'||r==='R')?TI.MTN:TI.MTN;
  if(f.cave||f.dun||f.gate){const c=f.col;
   for(let cc=c-2;cc<=c+2;cc++){set(cc,3,TI.FLOORX);}
   if(f.dun||f.gate){for(let cc=c-1;cc<=c+1;cc++)set(cc,1,TI.DSTRUCT);set(c-1,2,TI.DSTRUCT);set(c+1,2,TI.DSTRUCT);
    set(c,2,f.dun?TI.DENT:(S&&S.shards.every(Boolean)?TI.DENT:TI.GATE));}
   else if(f.hidden==='grave'){set(c-1,2,TI.GRAVE);set(c+1,2,TI.GRAVE);set(c,1,TI.FLOORX);set(c-1,1,TI.GRAVE);set(c+1,1,TI.GRAVE);
    if(F('gp:'+sx+','+sy)){set(c,1,TI.GRAVE);set(c,2,TI.CAVE);}else set(c,2,TI.GRAVEPUSH);}
   else{for(let cc=c-1;cc<=c+1;cc++)set(cc,1,fac);set(c-1,2,fac);set(c+1,2,fac);
    if(f.hidden==='bomb'&&!F('bm:'+sx+','+sy))set(c,2,TI.CRACK);else set(c,2,TI.CAVE);}
  }
  if(f.fountain){for(let c=10;c<=14;c++)for(let w=1;w<=3;w++)set(c,w,TI.FLOORX);set(11,1,TI.FOUNTAIN);set(12,1,TI.FOUNTAIN);set(11,2,TI.FOUNTAIN);set(12,2,TI.FOUNTAIN);}
 }
 // corridor clear
 for(let c=1;c<15;c++)for(let w=4;w<=6;w++){const v=t[w*16+c];if(v!==TI.WATER||r!=='L')if(SOLID.has(v)&&v!==TI.FOUNTAIN)set(c,w,TI.FLOORX);}
 for(let w=1;w<10;w++)for(let c=6;c<=9;c++){const v=t[w*16+c];if(SOLID.has(v)&&!(f&&(f.dun||f.gate||f.cave)&&Math.abs(c-f.col)<=1&&w<=2))set(c,w,TI.FLOORX);}
 if(r==='L'&&sx===4){for(let w=1;w<10;w++)for(let c=1;c<15;c++){t[w*16+c]=(c===7||c===8||w===5)?TI.BRIDGE:TI.WATER;}}
 return t;
}
function buildRoom(desc){
 let rm;
 if(desc.k==='ow'){const t=genOW(desc.sx,desc.sy);rm={kind:'ow',sx:desc.sx,sy:desc.sy,key:'ow:'+desc.sx+','+desc.sy,style:REG[desc.sy][desc.sx],tiles:t};}
 else if(desc.k==='cave'){const t=new Uint8Array(176).fill(TI.CFLOOR);for(let c=0;c<16;c++){t[c]=TI.CWALL;t[160+c]=TI.CWALL;}for(let w=0;w<11;w++){t[w*16]=TI.CWALL;t[w*16+15]=TI.CWALL;}
  t[160+7]=TI.CFLOOR;t[160+8]=TI.CFLOOR;t[4*16+4]=TI.FIRE;t[4*16+11]=TI.FIRE;t[4*16+7]=TI.NPCS;t[4*16+8]=TI.NPCS;
  rm={kind:'cave',id:desc.id,ret:desc.ret,key:'cave:'+desc.id,style:'cave',tiles:t,cave:CAVES[desc.id]};}
 else{const D=DUN[desc.d],spec=D.rooms[desc.x+','+desc.y];const t=new Uint8Array(176);
  for(let w=0;w<11;w++)for(let c=0;c<16;c++)t[w*16+c]=(c<2||c>13||w<2||w>8)?TI.DWALL:TI.FLOOR;
  const tp=TPL[spec.tpl]||TPL.empty;const pushed=F('push:d'+desc.d+':'+desc.x+','+desc.y);
  for(let w=0;w<7;w++)for(let c=0;c<12;c++){const ch=tp[w][c];let v=-1;if(ch==='B')v=TI.BLOCK;else if(ch==='S')v=TI.STATUE;else if(ch==='W')v=TI.DWATER;else if(ch==='P')v=pushed?-2:TI.PBLOCK;
   if(v===-2){t[(w+2)*16+c+2]=TI.FLOOR;t[(w+1)*16+c+2]=TI.BLOCK;}else if(v>=0)t[(w+2)*16+c+2]=v;}
  rm={kind:'dun',d:desc.d,x:desc.x,y:desc.y,key:'d'+desc.d+':'+desc.x+','+desc.y,style:'d'+desc.d,tiles:t,spec,doors:{}};
  applyDoors(rm);}
 return rm;
}
function doorState(rm,side){const D=DUN[rm.d],dr=D.doors[rm.x+','+rm.y+','+side];
 if(!dr){if(side==='s'&&rm.spec.ent)return'exit';return'none';}
 if(dr.ty==='o')return'open';
 if(dr.ty==='L')return F('lk:'+rm.d+':'+dr.id)?'open':'lock';
 if(dr.ty==='B')return F('bm:'+rm.d+':'+dr.id)?'open':'bomb';
 if(dr.ty==='P')return F('push:d'+rm.d+':'+dr.owner)?'open':'shut';
 return'none';}
function applyDoors(rm){const t=rm.tiles;for(const side of['n','s','e','w']){let st=doorState(rm,side);if(rm.trapped&&(st==='open'))st='shut';rm.doors[side]=st;
 const[c0,r0,cw,rh]=DOORRECT[side];const v=st==='open'||st==='exit'?TI.DOOR_OPEN:st==='lock'?TI.DOOR_LOCK:st==='shut'?TI.DOOR_SHUT:st==='bomb'?TI.DOOR_BOMB:TI.DWALL;
 for(let c=c0;c<c0+cw;c++)for(let w=r0;w<r0+rh;w++)t[w*16+c]=v;}rm.bg=null;}

function midiF(m){return 440*Math.pow(2,(m-69)/12);}
function chordT(c,oct){const[r,mn]=CH[c];const b=12*(oct+1)+r;return[b,b+(mn?3:4),b+7,b+12];}
function parseMel(s){return s.replace(/\|/g,' ').trim().split(/\s+/).map(tk=>{const[n,d]=tk.split(':');return{f:n==='R'?0:NF(n),d:+d||1};});}
function bassLine(chords,oct,pat){const out=[];chords.forEach(c=>{const[r,t3,f5,o]=chordT(c,oct);const P_={R:r,T:t3,F:f5,O:o};pat.split(' ').forEach(tk=>{const[n,d]=tk.split(':');out.push({f:midiF(P_[n]),d:+d});});});return out;}
function arpLine(chords,oct,seqs){const out=[];chords.forEach(c=>{const ns=chordT(c,oct);seqs.forEach(i=>out.push({f:midiF(ns[i]),d:1}));});return out;}

CH.A=[9,0];

 overworld:{bpm:132,ch:[{type:'p25',vol:0.16,notes:parseMel(OWMEL)},{type:'triangle',vol:0.34,notes:bassLine(OWCH,2,'R:2 F:2 O:2 F:2')},{type:'p12',vol:0.05,notes:arpLine(OWCH,4,[0,1,2,1,0,1,2,3])}],drums:'k.h.s.h.'},
 dungeon:{bpm:96,ch:[{type:'p12',vol:0.15,notes:parseMel(DGMEL)},{type:'triangle',vol:0.34,notes:bassLine(DGCH,2,'R:1 R:1 O:1 R:1 R:1 R:1 F:1 T:1')}],drums:'k...h...'},
 boss:{bpm:168,ch:[{type:'p25',vol:0.15,notes:parseMel(BSMEL)},{type:'triangle',vol:0.36,notes:bassLine(BSCH,2,'R:1 O:1 R:1 O:1 R:1 O:1 R:1 O:1')},{type:'p12',vol:0.05,notes:arpLine(BSCH,4,[0,1,2,3,2,1,0,1])}],drums:'k.s.k.sh'},
 final:{bpm:150,ch:[{type:'p25',vol:0.15,notes:parseMel(FNMEL)},{type:'triangle',vol:0.36,notes:bassLine(FNCH,2,'R:1 R:1 O:1 R:1 F:1 R:1 O:1 F:1')},{type:'p12',vol:0.05,notes:arpLine(FNCH,4,[0,2,1,3,0,2,1,3])}],drums:'k.skk.s.'},
 ending:{bpm:100,ch:[{type:'p25',vol:0.16,notes:parseMel(OWMEL)},{type:'triangle',vol:0.32,notes:bassLine(OWCH,2,'R:4 F:4')},{type:'p12',vol:0.06,notes:arpLine(OWCH,4,[0,1,2,3,2,1,2,3])}],drums:'k...s...'}
};
SONGS.title=Object.assign({},SONGS.overworld,{bpm:120});
let pendingSong;
function music(name){if(name==='cave')name=null;if(!AC){pendingSong=name;return;}if(curSong===name)return;curSong=name;
 if(songBus){const old=songBus;old.gain.setTargetAtTime(0,AC.currentTime,0.05);setTimeout(()=>{try{old.disconnect();}catch(e){}},400);songBus=null;}seq=null;if(!name)return;
 const song=SONGS[name];songBus=AC.createGain();songBus.gain.value=0.7;songBus.connect(master);const e8=60/song.bpm/2;const t0=AC.currentTime+0.08;
 seq={song,e8,chans:song.ch.map(c=>({c,i:0,t:t0})),dr:{i:0,t:t0}};}
function tickMusic(){if(!AC||!seq||!songBus)return;const ahead=AC.currentTime+0.3;const gainMul=(mode==='paused'||mode==='sub')?0.35:1;songBus.gain.value=0.7*gainMul;
 for(const ch of seq.chans){while(ch.t<ahead){const n=ch.c.notes[ch.i];const d=n.d*seq.e8;if(n.f)osc(ch.c.type,n.f,ch.t,d*0.92,ch.c.vol,null,songBus);ch.t+=d;ch.i=(ch.i+1)%ch.c.notes.length;}}
 const dr=seq.dr,pat=seq.song.drums;while(dr.t<ahead){const c=pat[dr.i%pat.length];if(c==='k'){osc('sine',150,dr.t,0.1,0.4,45,songBus);}else if(c==='s')nz(dr.t,0.12,0.2,'highpass',1200,songBus);else if(c==='h')nz(dr.t,0.04,0.08,'highpass',7000,songBus);dr.t+=seq.e8;dr.i++;}}
function setMute(m){muted=m;try{localStorage.setItem('lq.muted',m?'1':'0');}catch(e){}if(master)master.gain.value=m?0:0.55;document.getElementById('mute').textContent=m?'🔇':'🔊';}

// ---------- input ----------
const held={},latch={},prevH={},touchH={};const inp={};
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyJ:'a',Space:'a',KeyZ:'a',KeyK:'b',KeyX:'b',Enter:'start',KeyI:'start',KeyP:'pause',Escape:'pause'};
addEventListener('keydown',e=>{initAudio();if(e.code==='KeyM'){setMute(!muted);e.preventDefault();return;}
 if(DEBUG&&!e.repeat&&debugKey(e.code)){e.preventDefault();return;}
 const k=KM[e.code];if(k){e.preventDefault();if(!held[k])latch[k]=true;held[k]=true;}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){held[k]=false;}});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});
function readInput(){for(const k of['up','down','left','right','a','b','start','pause']){const h=!!(held[k]||touchH[k]);inp[k]=h;const p=!!latch[k]||(h&&!prevH[k]);inp['p'+k[0].toUpperCase()+k.slice(1)]=p;prevH[k]=h;latch[k]=false;}}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||matchMedia('(pointer: coarse)').matches;
if(isTouch)document.body.classList.add('touch');
const dpad=document.getElementById('dpad');
['up','right','down','left'].forEach(d=>{const a=document.createElement('div');a.className='arm';a.dataset.d=d;a.id='arm-'+d;const ar=document.createElement('div');ar.className='arr';a.appendChild(ar);dpad.appendChild(a);});
const hub=document.createElement('div');hub.className='hub';dpad.appendChild(hub);
function setDpad(dir){for(const d of['up','down','left','right']){const on=d===dir;if(on&&!touchH[d])latch[d]=true;touchH[d]=on;document.getElementById('arm-'+d).classList.toggle('on',on);}}
function dpadFrom(e){const r=dpad.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<r.width*0.1)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{dpad.setPointerCapture(e.pointerId);}catch(_){}setDpad(dpadFrom(e));});
dpad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){if(dpad.hasPointerCapture&&dpad.hasPointerCapture(e.pointerId))setDpad(dpadFrom(e));}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpad.addEventListener(ev,()=>setDpad(null)));
[['bA','a'],['bB','b'],['bStart','start']].forEach(([id,k])=>{const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{el.setPointerCapture(e.pointerId);}catch(_){}if(!touchH[k])latch[k]=true;touchH[k]=true;el.classList.add('on');});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{touchH[k]=false;el.classList.remove('on');}));});
document.getElementById('mute').addEventListener('click',e=>{e.stopPropagation();initAudio();setMute(!muted);});
document.getElementById('pz').addEventListener('click',e=>{e.stopPropagation();initAudio();latch.pause=true;});
cv.addEventListener('pointerdown',()=>{initAudio();if(mode==='title'||mode==='intro'||mode==='ending'||mode==='gameover')latch.start=true;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
setMute(muted);

// ---------- layout ----------
function layout(){const w=innerWidth,h=innerHeight;let s,cx,cy;
 const place=(el,x,y,ww,hh)=>{el.style.left=x+'px';el.style.top=y+'px';el.style.width=ww+'px';el.style.height=hh+'px';};
 if(isTouch){const A=document.getElementById('bA'),B=document.getElementById('bB'),St=document.getElementById('bStart');
  if(h>=w){const ctrlH=Math.min(Math.max(h*0.36,200),320);s=Math.min(w/256,(h-ctrlH)/240);const cw=256*s,ch=240*s;cx=(w-cw)/2;cy=Math.max(0,Math.min(40,(h-ctrlH-ch)/2));
   const top=cy+ch,area=h-top;const ds=Math.min(area*0.72,w*0.44,190);const mid=top+area*0.46;place(dpad,w*0.05,mid-ds/2,ds,ds);
   const bs=Math.min(ds*0.42,78);place(A,w-bs-w*0.05,mid-bs*0.95,bs,bs);place(B,w-bs*2.25-w*0.05,mid-bs*0.25,bs,bs);place(St,w/2-40,h-Math.max(34,area*0.14)-6,80,30);}
  else{const side=Math.min(w*0.2,190);s=Math.min((w-2*side)/256,h/240);if(256*s<w*0.45)s=Math.min(w/256,h/240);const cw=256*s,ch=240*s;cx=(w-cw)/2;cy=(h-ch)/2;
   const ds=Math.min(side*0.95,h*0.48,180);place(dpad,Math.max(6,(cx-ds)/2),h-ds-h*0.08,ds,ds);const bs=Math.min(ds*0.42,72);const rx=w-Math.max(6,(w-cx-cw-bs*2.2)/2);
   place(A,rx-bs,h-ds*0.75-h*0.08,bs,bs);place(B,rx-bs*2.2,h-ds*0.45-h*0.08,bs,bs);place(St,w-Math.max(cx/2,50)-40,h*0.18+30,80,30);}
  const ds=parseFloat(dpad.style.width),u=ds/3;const arms={up:[u,0,u,u+2],down:[u,2*u-2,u,u+2],left:[0,u,u+2,u],right:[2*u-2,u,u+2,u]};
  for(const d in arms){const el=document.getElementById('arm-'+d);const[a,b,c2,d2]=arms[d];place(el,a,b,c2,d2);el.style.borderRadius='6px';const ar=el.firstChild;const t=u*0.22;ar.style.left=(c2/2-t)+'px';ar.style.top=(d2/2-t)+'px';
   ar.style.borderWidth=t+'px';ar.style.borderColor='transparent';const side={up:'borderBottomColor',down:'borderTopColor',left:'borderRightColor',right:'borderLeftColor'}[d];ar.style[side]='#c0cbdc';
   if(d==='up'){ar.style.top=(d2/2-t*1.5)+'px';}if(d==='down'){ar.style.top=(d2/2-t*0.5)+'px';}if(d==='left'){ar.style.left=(c2/2-t*1.5)+'px';}if(d==='right'){ar.style.left=(c2/2-t*0.5)+'px';}}
  place(hub,u-1,u-1,u+2,u+2);[A,B].forEach(el=>{el.style.fontSize=Math.round(parseFloat(el.style.width)*0.38)+'px';});}
 else{s=Math.min(w/256,h/240);if(s>=2)s=Math.floor(s);cx=(w-256*s)/2;cy=(h-240*s)/2;}
 cv.style.width=Math.round(256*s)+'px';cv.style.height=Math.round(240*s)+'px';cv.style.left=Math.round(cx)+'px';cv.style.top=Math.round(cy)+'px';}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));layout();
// ---------- flow ----------
function newGame(){S=newSave();saveGame();mode='intro';introT=0;music('title');sfx('start');}
function beginGame(){lastRegion='';room=null;resetPlayer(112,96,0);mode='play';enterVia({k:'ow',sx:4,sy:4},112,96,0);fade.after=()=>showMsg('A DARK CAVE LIES TO THE NORTHWEST... GO ON IN, LENNON!',200);}
function continueGame(){S=loadSave()||newSave();if(!S.cp)S.cp={k:'ow',sx:4,sy:4};resetPlayer(112,80,2);lastRegion='';respawn();sfx('start');}
function step(){readInput();frame++;tickMusic();
 switch(mode){
 case'title':{const o=titleOpts();if(menuI>=o.length)menuI=0;if(inp.pUp||inp.pDown){menuI=(menuI+(inp.pUp?o.length-1:1))%o.length;sfx('menu');}
  if(inp.pStart||inp.pA){const c=o[menuI];if(c==='CONTINUE')continueGame();else newGame();}break;}
 case'intro':introT++;if(inp.pStart||inp.pA||introT>INTRO.length*12/0.45+300){beginGame();}break;
 case'play':stepPlay();break;
 case'scroll':scroll.t+=1;if(scroll.t>=scroll.dur)finishScroll();break;
 case'fade':fade.t++;if(fade.t===fade.dur){fade.then();}if(fade.t>=fade.dur*2){const a=fade.after;fade=null;mode='play';if(a)a();}break;
 case'sub':{const av=bItems();if(av.length){if(inp.pLeft||inp.pRight||inp.pUp||inp.pDown){subI=(subI+((inp.pLeft||inp.pUp)?av.length-1:1))%av.length;S.bsel=av[subI];sfx('menu');}if(!av.includes(S.bsel))S.bsel=av[0];}
  if(inp.pStart||inp.pPause){mode='play';sfx('menu');}break;}
 case'paused':if(inp.pPause||inp.pStart){mode='play';sfx('menu');}break;
 case'dying':dieT++;if(msg&&--msg.dur<=0)msg=null;if(dieT>120){mode='gameover';menuI=0;saveGame();}break;
 case'gameover':if(inp.pUp||inp.pDown){menuI=1-menuI;sfx('menu');}if(inp.pStart||inp.pA){if(menuI===0){S.hp=S.maxHp;respawn();}else{saveGame();mode='title';menuI=0;music('title');}}break;
 case'ending':endT++;if(endT>180&&(inp.pStart||inp.pA)){mode='title';menuI=0;music('title');}break;
 }}
function stepPlay(){
 if(inp.pStart&&P.hold===0&&!P.auto){mode='sub';subI=Math.max(0,bItems().indexOf(S.bsel));sfx('menu');return;}
 if(inp.pPause){mode='paused';sfx('menu');return;}
 if(msg&&--msg.dur<=0)msg=null;if(clink>0)clink--;if(shake>0)shake--;S.time+=1/60;
 if(room.kind==='cave'){const m=room.msgOverride||room.cave.msg;if(room.msgOverride!==room.lastOv){room.lastOv=room.msgOverride;room.msgN=0;}if(room.msgN<m.length){room.msgN+=0.5;if(room.msgN%2===0&&m[room.msgN|0]&&m[room.msgN|0]!==' ')sfx('blip');}}
 updatePlayer();if(mode!=='play')return;
 if(P.hold===0){enemies.forEach(updateEnemy);updateShots();swordHits();contactDamage();}
 enemies=enemies.filter(e=>!e.dead);updateItems();updateFx();updateSlide();checkClear();
 if(room.bossDrop>0&&--room.bossDrop===0&&room.kind==='dun'){addItem('hc',104,80,{flag:'it:'+room.key+':hc'});if(!S.shards[room.d-1])addItem('shard',136,80,{flag:'shard'});sfx('secret');}
 if(S.hp<=2&&S.hp>0){if(++lowT%28===0)sfx('lowhp');}
 if(endT>0){endT++;if(endT%12===0&&endT<130){fx.push({k:'boom',x:ri(40,216),y:ri(40,140),t:0});sfx('bomb');shake=6;}if(endT>=190){S.done=true;saveGame();mode='ending';endT=0;music('ending');}}}
// ---------- debug ----------
function giveAll(){S.items.sword=2;S.items.shield=2;S.items.boom=1;S.items.bow=1;S.items.bombbag=1;S.bombs=S.maxBombs;S.items.potion=2;S.gems=Math.max(S.gems,200);S.keys+=5;S.maxHp=Math.max(S.maxHp,16);S.hp=S.maxHp;if(!S.bsel)S.bsel='boom';saveGame();showMsg('DEBUG: ALL ITEMS GIVEN',80);}
function giveShards(){S.shards=[true,true,true];saveGame();showMsg('DEBUG: ALL SUN SHARDS',80);}
function warpDungeon(d){if(!S)S=newSave();if(!S.items.sword)S.items.sword=1;enterDungeon(d);}
function warpBoss(d){if(!S)S=newSave();if(!S.items.sword)S.items.sword=1;d=d||(room&&room.kind==='dun'?room.d:1);const D=DUN[d];enterVia({k:'dun',d,x:D.boss[0],y:D.boss[1]},120,128,0);}
function warpOW(sx,sy,x,y){if(!S)S=newSave();enterVia({k:'ow',sx,sy},x==null?112:x,y==null?80:y,2);}
function debugKey(c){if(mode==='title'||mode==='intro'){if(/^Digit[0-9]$/.test(c)){S=loadSave()||newSave();resetPlayer(112,80,2);}else return false;}
 switch(c){case'Digit1':case'Digit2':case'Digit3':warpDungeon(+c[5]);return true;case'Digit4':giveShards();warpDungeon(4);return true;case'Digit5':warpBoss();return true;
  case'Digit6':warpOW(2,0,176,64);return true;case'Digit7':giveShards();return true;case'Digit9':giveAll();return true;case'Digit0':invinc=!invinc;showMsg('INVINCIBLE '+(invinc?'ON':'OFF'),60);return true;case'Digit8':warpOW(4,4,112,96);return true;}return false;}
if(DEBUG){const d=document.getElementById('dbg');d.style.display='flex';[['D1','Digit1'],['D2','Digit2'],['D3','Digit3'],['FINAL','Digit4'],['BOSS','Digit5'],['GATE','Digit6'],['START','Digit8'],['ALL','Digit9'],['SHARDS','Digit7'],['INV','Digit0']].forEach(([l,c])=>{const b=document.createElement('button');b.textContent=l;b.addEventListener('click',e=>{e.stopPropagation();initAudio();debugKey(c);});d.appendChild(b);});}
// ---------- test hooks ----------
window.__LQ={get mode(){return mode;},get P(){return P;},get S(){return S;},get room(){return room;},get enemies(){return enemies;},get items(){return items;},get pshots(){return pshots;},get msg(){return msg;},get frame(){return frame;},
 giveAll:()=>giveAll(),giveShards:()=>giveShards(),warpDungeon,warpBoss,warpOW,setInv:v=>{invinc=!!v;},killAll:()=>{enemies.forEach(e=>{if(!e.dead)killEnemy(e);});},layout,TI,
 tileAt:(c,r)=>room.tiles[r*16+c],buildRoom:d=>buildRoom(d),SOLID:[...SOLID],enterCave:(id,sx,sy)=>enterVia({k:'cave',id,ret:{sx:sx||3,sy:sy||3,x:176,y:48}},120,144,0),FEAT,DUN,REG};
// ---------- loop ----------
let acc=0,last=performance.now();
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<5){step();acc-=1000/60;n++;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
